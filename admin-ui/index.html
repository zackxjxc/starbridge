<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StarBridge 管理台</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#10141d; color:#e7edf7; }
    body { max-width:1100px; margin:0 auto; padding:32px 20px; -webkit-user-select:none; user-select:none; }
    input:read-write, textarea:read-write, [data-copyable] { -webkit-user-select:text; user-select:text; }
    h1 { margin:0 0 6px; } .muted { color:#95a2b7; }
    .toolbar { display:flex; gap:12px; align-items:center; margin:24px 0 16px; flex-wrap:wrap; }
    button { border:0; border-radius:8px; padding:9px 14px; background:#4f8cff; color:white; cursor:pointer; }
    button.secondary { background:#273249; } table { width:100%; border-collapse:collapse; background:#171e2b; border-radius:12px; overflow:hidden; }
    th,td { text-align:left; padding:12px; border-bottom:1px solid #293347; font-size:14px; } th { color:#a9b7cf; }
    .pill { display:inline-block; padding:3px 8px; border-radius:999px; background:#293347; } .online { color:#81e6a8; }
    pre { background:#171e2b; padding:14px; border-radius:10px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>StarBridge 管理台</h1>
  <div class="muted">本地开发中心服务 · <span id="health">检查中…</span></div>
  <div class="toolbar"><input id="username" placeholder="账户名称"><input id="password" type="password" placeholder="密码"><button onclick="login()">登录管理台</button><button onclick="loadSummary()">刷新设备</button><button class="secondary" onclick="loadHealth()">检查服务</button></div>
  <table><thead><tr><th>名称</th><th>账户</th><th>系统</th><th>能力</th><th>状态</th></tr></thead><tbody id="devices"><tr><td colspan="5">管理台需要端侧登录后才能展示设备。</td></tr></tbody></table>
  <h2>会话</h2><table><thead><tr><th>会话</th><th>策略</th><th>路径</th><th>状态</th><th>失败原因</th></tr></thead><tbody id="sessions"><tr><td colspan="5">请先登录管理台。</td></tr></tbody></table>
  <p class="muted" id="message">管理台使用当前账户的 Bearer 令牌读取设备和会话摘要。</p>
  <script>
    let token='';
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function showMessage(text, copyable=false){ const element=document.querySelector('#message'); element.textContent=text; element.toggleAttribute('data-copyable',copyable&&String(text??'').trim().length>0); }
    function copyableRegion(node){ return (node?.nodeType===Node.ELEMENT_NODE?node:node?.parentElement)?.closest('[data-copyable]'); }
    function guardClipboard(event){
      const editor=event.target instanceof Element?event.target.closest('input,textarea'):null;
      if(editor){
        if(!editor.disabled&&!editor.readOnly&&(editor.tagName==='TEXTAREA'||['text','password','search','email','url','tel'].includes(editor.type))) return;
        event.preventDefault(); return;
      }
      const selection=window.getSelection();
      if(event.type==='copy'&&selection&&selection.rangeCount===1&&!selection.isCollapsed&&selection.toString().trim()){
        const range=selection.getRangeAt(0); const region=copyableRegion(range.startContainer);
        if(region&&region===copyableRegion(range.endContainer)&&region.contains(range.commonAncestorContainer)) return;
      }
      event.preventDefault();
    }
    document.addEventListener('copy',guardClipboard);
    document.addEventListener('cut',guardClipboard);
    async function loadHealth(){ const r=await fetch('/api/health'); const j=await r.json(); document.querySelector('#health').textContent=`${j.service} ${j.version} · ${new Date(j.now*1000).toLocaleTimeString()}`; }
    async function login(){ try { const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})}); const j=await r.json(); if(!r.ok) throw new Error(j.error); token=j.access_token; await loadSummary(); } catch(e){ showMessage(e.message,true); } }
    async function loadSummary(){ if(!token){ showMessage('请先登录管理台。'); return; } try { const r=await fetch('/api/v1/admin/summary',{headers:{Authorization:`Bearer ${token}`}}); const j=await r.json(); if(!r.ok) throw new Error(j.error); document.querySelector('#devices').innerHTML=j.devices.length?j.devices.map(d=>`<tr><td data-copyable>${esc(d.display_name)}</td><td data-copyable>${esc(d.account)}</td><td>${esc(d.os)}/${esc(d.arch)}</td><td>${esc(d.capabilities.join(', '))}</td><td class="${d.online?'online':''}">${d.online?'在线':'离线'}</td></tr>`).join(''):'<tr><td colspan="5">暂无设备</td></tr>'; document.querySelector('#sessions').innerHTML=j.sessions.length?j.sessions.map(s=>`<tr><td>${esc(s.session_id.slice(0,8))}</td><td>${esc(s.policy)}</td><td>${esc(s.path)}</td><td>${esc(s.status)}</td><td${s.failure_reason?' data-copyable':''}>${esc(s.failure_reason||'')}</td></tr>`).join(''):'<tr><td colspan="5">暂无会话</td></tr>'; showMessage(`账户 ${j.account} · 已刷新`); } catch(e){ showMessage(e.message,true); } }
    loadHealth();
  </script>
</body>
</html>
