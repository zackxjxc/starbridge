[package]
name = "starbridge-client"
default-run = "starbridge-client"
version.workspace = true
edition.workspace = true
rust-version = "1.90"
publish = false

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-dialog"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true }
tauri-winres.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures = "0.3"
fs2 = "0.4"
libp2p = { version = "0.56", default-features = false, features = ["macros", "identify", "mdns", "noise", "ping", "tcp", "tokio", "yamux"] }
machine-uid = "=0.6.0"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
starbridge-protocol = { path = "../protocol" }
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
starbridge-server = { path = "../server" }
