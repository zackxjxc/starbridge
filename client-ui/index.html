<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StarBridge</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0f1420;color:#e7edf7}body{max-width:1080px;margin:auto;padding:28px 18px}h1{margin-bottom:4px}.muted{color:#9ba8bd}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:22px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.card{background:#171e2b;border:1px solid #293448;border-radius:14px;padding:18px;margin-bottom:18px}label{display:block;color:#a9b7cf;font-size:13px;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #3a4862;background:#0f1420;color:#e7edf7;padding:10px}button{border:0;border-radius:8px;padding:10px 14px;background:#4f8cff;color:#fff;cursor:pointer;margin:6px 6px 0 0}button.secondary{background:#293448}.status{padding:10px;border-radius:9px;background:#202b40}.error{color:#ff9e9e}.device{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #293448}.device:last-child{border-bottom:0}.online{color:#81e6a8}.offline{color:#f0b37e}.warn{color:#f0b37e}.mono{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#0f1420;padding:10px;border-radius:8px}
  </style>
</head>
<body>
  <h1>StarBridge</h1><div class="muted">本地浏览器控制台 · <span id="role"></span></div>
  <div class="grid">
    <section><div class="card"><h2>登录中心</h2><label>中心 URL</label><input id="server" value="http://127.0.0.1:17850"><label>账户名称</label><input id="username" autocomplete="username"><label>密码</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">登录并登记设备</button><button class="secondary" onclick="logout()">退出</button></div>
      <div class="card"><h2>本机设置</h2><label>显示名称</label><input id="display"><label>SSH 别名</label><input id="alias"><label>SSH 用户</label><input id="sshuser"><label><input id="direct" type="checkbox" style="width:auto"> 本机只允许直连</label><button class="secondary" onclick="saveConfig()">保存设置</button></div>
    </section>
    <section><div class="card"><h2>状态</h2><div id="status" class="status">加载中…</div><p class="muted mono" id="runtime"></p><p class="muted mono" id="ssh"></p><button class="secondary" onclick="copyNodes()">复制全部可用执行节点</button><pre id="copied" hidden></pre></div><div class="card"><h2>设备</h2><div id="devices">暂无设备</div></div><div class="card"><h2>当前会话</h2><div id="session">暂无会话</div><pre id="sshcmd" hidden></pre><button class="secondary" onclick="disconnect()">断开</button></div></section>
  </div>
  <script>
    let snapshot={};
    const privilegeText={user:'普通用户权限',admin:'管理员权限',system:'SYSTEM 权限',unknown:'权限未知'};
    function privilegeHtml(d){if(d.role!=='executor')return'';const p=d.ssh_privilege||'unknown';return `<div class="${p==='user'||p==='unknown'?'warn':'muted'}">SSH：${privilegeText[p]||p}${p==='user'?'，执行可能受限：不能安装软件、修改系统设置或访问其他用户的文件':''}</div>`}
    async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
    async function load(){try{snapshot=await api('/api/v1/state');document.querySelector('#role').textContent=snapshot.role;document.querySelector('#server').value=snapshot.server_url;document.querySelector('#display').value=snapshot.display_name;document.querySelector('#runtime').textContent=snapshot.runtime.message+' · frpc='+snapshot.runtime.frpc_path;document.querySelector('#ssh').textContent=snapshot.ssh.message;const su=document.querySelector('#sshuser');if(snapshot.ssh.login_user){su.value=snapshot.ssh.login_user;su.readOnly=true;su.title='内置 SSH 服务只接受当前系统账户登录'}document.querySelector('#status').innerHTML=`${snapshot.logged_in?'已登录':'未登录'} · ${snapshot.stage}${snapshot.last_error?`<div class="error">${snapshot.last_error}</div>`:''}`;document.querySelector('#devices').innerHTML=snapshot.devices.length?snapshot.devices.map(d=>`<div class="device"><div><b>${d.display_name}</b> <span class="muted">${d.role}</span><div class="muted mono">${d.ssh_alias} · ${d.os}/${d.arch} · ${d.capabilities.join(', ')}</div>${privilegeHtml(d)}</div><div class="${d.online?'online':'offline'}">${d.online?'在线':'离线'} ${d.role==='executor'&&snapshot.role==='controller'?`<br><button onclick="connect('${d.node_id}')">连接</button>`:''}</div></div>`).join(''):'暂无设备';document.querySelector('#session').textContent=snapshot.session?`${snapshot.session.status} · ${snapshot.session.path} · ${snapshot.session.session_id}`:'暂无会话';document.querySelector('#sshcmd').hidden=!snapshot.ssh_command;document.querySelector('#sshcmd').textContent=snapshot.ssh_command||'';}catch(e){document.querySelector('#status').textContent=e.message}}
    async function login(){try{await saveConfig();await api('/api/v1/login',{method:'POST',body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});await load()}catch(e){alert(e.message)}}
    async function logout(){await api('/api/v1/logout',{method:'POST'});await load()}
    async function saveConfig(){await api('/api/v1/config',{method:'PUT',body:JSON.stringify({server_url:document.querySelector('#server').value,display_name:document.querySelector('#display').value,ssh_alias:document.querySelector('#alias').value,ssh_user:document.querySelector('#sshuser').value,allow_relay:!document.querySelector('#direct').checked,direct_only:document.querySelector('#direct').checked})})}
    async function connect(id){try{await api('/api/v1/connect',{method:'POST',body:JSON.stringify({target_node_id:id,policy:'direct_preferred'})});await load()}catch(e){alert(e.message);await load()}}
    async function disconnect(){try{await api('/api/v1/disconnect',{method:'DELETE'});await load()}catch(e){alert(e.message)}}
    async function copyNodes(){const j=await api('/api/v1/copy/nodes');document.querySelector('#copied').hidden=false;document.querySelector('#copied').textContent=j.text||'暂无在线执行节点';try{await navigator.clipboard.writeText(j.text)}catch{}}
    async function loadConfig(){try{const c=await api('/api/v1/config');document.querySelector('#alias').value=c.ssh_alias;document.querySelector('#sshuser').value=c.ssh_user;document.querySelector('#direct').checked=c.direct_only}catch{}}
    loadConfig();load();setInterval(load,4000);
  </script>
</body>
</html>
